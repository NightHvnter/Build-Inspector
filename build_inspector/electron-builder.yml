appId: com.nighthvnter.buildinspector
productName: Build Inspector
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# File names without the version, so the website can link to
# https://github.com/NightHvnter/Build-Inspector/releases/latest/download/<name>.
win:
  executableName: Build Inspector
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: Build-Inspector-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - target: dmg
      arch: [universal]
  # No Apple developer certificate: an ad-hoc signature lets the app start on Apple
  # silicon (macOS still asks to confirm the first launch).
  identity: '-'
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: Build-Inspector-macOS.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: NightHvnter <NightHvnter@users.noreply.github.com>
  category: Utility
appImage:
  artifactName: Build-Inspector-Linux.${ext}
deb:
  artifactName: Build-Inspector-Linux.${ext}
npmRebuild: false
publish:
  provider: github
  owner: NightHvnter
  repo: Build-Inspector
  releaseType: release
